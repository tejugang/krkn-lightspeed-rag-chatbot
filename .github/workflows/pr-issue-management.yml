name: PR and Issue Management

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened]

jobs:
  handle-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
      contents: read

    steps:
      - name: Check linked issue and assign reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prCreator = pr.user.login;

            // Extract issue number from PR body using keywords like 'close', 'closes', 'fix', 'fixes', 'resolve', 'resolves' followed by #issue_number
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const matches = [...(pr.body || '').matchAll(issueRegex)];

            if (matches.length === 0) {
              const comment = `Thanks for your contribution! This PR does not appear to have a linked issue. Please refer to our [contribution guidelines](CONTRIBUTING.md) for the proper PR process.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });

              console.log('No linked issue found - posted comment');
              return;
            }

            // Check the first linked issue
            const issueNumber = parseInt(matches[0][1]);

            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              const issueAssignees = issue.assignees.map(a => a.login);

              if (!issueAssignees.includes(prCreator)) {
                const comment = `Thanks for your contribution! However, this PR is linked to issue #${issueNumber}, which is not assigned to you. Please refer to our [contribution guidelines](CONTRIBUTING.md). PRs should only be opened by contributors who are assigned to the linked issue.`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });

                console.log(`PR creator ${prCreator} is not assigned to issue #${issueNumber}`);
                return;
              }

              // PR creator is assigned to the issue - assign reviewers
              const reviewers = ['tejugang']; 

              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: reviewers
              });

              console.log(`Assigned reviewers: ${reviewers.join(', ')}`);

            } catch (error) {
              console.error(`Error checking issue #${issueNumber}:`, error);

              const comment = `Unable to verify the linked issue #${issueNumber}. Please ensure the issue exists and is properly configured.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }

  handle-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Request issue approval and assignment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Add labels to indicate needs review
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['needs-approval', 'needs-assignment']
            });

            // Post comment requesting approval from reviewers
            const reviewers = ['tejugang']; 
            const comment = `📋 New issue created! @${reviewers.join(' @')} - Please review this issue and:\n` +
              '1. Approve if it is valid and aligns with project goals\n' +
              '2. Assign to an appropriate team member\n' +
              '3. Remove the `needs-approval` and `needs-assignment` labels once assigned\n\n' +
              'The assigned person will then be able to create a PR to address this issue.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            console.log(`Issue #${issue.number} labeled and reviewers notified`)
