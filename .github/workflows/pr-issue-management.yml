
name: Issue Management

on:
  pull_request_target:
    types: [opened, reopened]
  issues:
    types: [opened, labeled]

jobs:
  
  
  
  handle-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Request issue approval and assignment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;

            // Add labels to indicate needs review
            if (action === 'opened') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-triage']
              });

              // Post comment requesting approval from reviewers
              const reviewers = ['tejugang']; 
              const comment = `awaiting maintainer review! \n @${reviewers.join(' @')} Please review and approve this issue.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });

              console.log(`Issue #${issue.number} labeled and reviewers notified`) }
            
            if (action === 'labeled') {
              if (context.payload.label.name !== 'triage/accepted') {
                console.log(`Label ${context.payload.label.name} added - no action needed`);
                return;
              }
              const labels = issue.labels.map(l => l.name);

              if (labels.includes('kind/bug')) {
                console.log(`Issue #${issue.number} is a bug - skipping auto assignment`);
                return;
              }


              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [issue.user.login] 
              });

              const comment = `you've been assigned to this issue. Please submit a PR within 14 days.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });

              console.log(`Issue #${issue.number} assigned to ${issue.user.login}`); }
